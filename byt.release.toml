# Release config consumed by `byt release` (ADR-0021).
# The reusable workflow builds linux-gnu in the byt container (glibc floor) and
# *-apple-darwin natively on a macOS runner, then combines + publishes.
# `schema-gen` is a build-time helper and is intentionally not shipped.
[release]
name = "sldr"
lang = "rust"
bins = ["sldr", "sldr-server"]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[release.homebrew]
formula = "sldr"

[release.aur]
pkgname = "sldr-bin"
pkgdesc = "Modular markdown presentations powered by slidev"
license = "MIT"
url = "https://github.com/byteowlz/sldr"
provides = ["sldr"]
conflicts = ["sldr"]
