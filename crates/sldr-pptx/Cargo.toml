[package]
name = "sldr-pptx"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Native OOXML PowerPoint export/import for sldr — derives editable .pptx templates and decks from sldr layouts and flavors (a satellite, not core)"

[lints]
workspace = true

[dependencies]
sldr-core.workspace = true
sldr-renderer.workspace = true
anyhow.workspace = true

# Markdown body → OOXML paragraphs/runs
pulldown-cmark = { version = "0.12", default-features = false }

# OOXML parsing for round-trip import
quick-xml = "0.36"
# Namespace-aware bounded package validation; no DTD or network resolution.
roxmltree = "0.20"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"

# OOXML package = a ZIP of XML parts
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
