<!-- sldr:category framed -->
<!-- sldr:tags classic, branded -->
<!-- PPTX export zones (coordinates are percent of the slide box). -->
<!-- sldr:zone name=headline ph=title rep=placeholder-text x=4.4 y=6.3 w=70 h=9 -->
<!-- sldr:zone name=subheadline ph=body idx=3 rep=placeholder-text x=4.4 y=15.5 w=70 h=5 -->
<!-- sldr:zone name=left ph=body idx=1 rep=placeholder-text x=4.4 y=22.2 w=43 h=64 -->
<!-- sldr:zone name=right ph=body idx=2 rep=placeholder-text x=52.6 y=22.2 w=43 h=64 -->
<!-- sldr:zone name=footer ph=body idx=4 rep=placeholder-text x=4.4 y=92.5 w=80 h=5 -->
<!-- Layout: framed-cols — deck chrome (framed) with a two-column body
     (::left:: / ::right:: markers). Shared chrome CSS in base.css. -->
<div class="sldr-framed">
  <header class="sldr-frame-head">
    {{headline}}
    {{subheadline}}
  </header>
  <div class="sldr-frame-body">
    <div class="sldr-frame-cols">
      <div class="sldr-col">
        {{left}}
      </div>
      <div class="sldr-col">
        {{right}}
      </div>
    </div>
  </div>
</div>
