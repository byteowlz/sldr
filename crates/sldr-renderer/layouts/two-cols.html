<!-- sldr:category body -->
<!-- sldr:tags classic -->
<!-- PPTX export zones (trx-4s9s.2): heading + both columns map to editable
     placeholders. Percent of the slide box; EMU at export. Validated against
     docs/pptx-spike. -->
<!-- sldr:zone name=heading ph=title rep=placeholder-text x=4.4 y=6.3 w=91.1 h=12 -->
<!-- sldr:zone name=left ph=body idx=1 rep=placeholder-text x=4.4 y=22.2 w=43 h=64 -->
<!-- sldr:zone name=right ph=body idx=2 rep=placeholder-text x=52.6 y=22.2 w=43 h=64 -->
<!-- Layout: two-cols — two columns with optional heading (::left:: / ::right:: markers) -->
<div class="sldr-content">
  {{heading}}
  <div class="sldr-columns">
    <div class="sldr-col">
      {{left}}
    </div>
    <div class="sldr-col">
      {{right}}
    </div>
  </div>
</div>
