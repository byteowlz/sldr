<!-- sldr:category image -->
<!-- sldr:tags classic -->
<!-- PPTX export zones: image left as an embedded picture, content right as an
     editable text placeholder. Coordinates are percent of the slide box. -->
<!-- sldr:zone name=image rep=picture x=4.4 y=8 w=44 h=84 -->
<!-- sldr:zone name=content ph=body idx=1 rep=placeholder-text x=52 y=8 w=43.6 h=84 -->
<!-- Layout: image-left — image column left, content right (::content:: / ::image:: markers) -->
<div class="sldr-content">
  <div class="sldr-columns">
    <div class="sldr-col-image">
      {{image}}
    </div>
    <div class="sldr-col-content">
      {{content}}
    </div>
  </div>
</div>
