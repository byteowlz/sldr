<!-- sldr:category framed -->
<!-- sldr:tags classic, branded -->
<!-- PPTX export zones: framed chrome + a content column (editable text) and an
     image column (embedded picture). Coordinates are percent of the slide box. -->
<!-- sldr:zone name=headline ph=title rep=placeholder-text x=4.4 y=6.3 w=70 h=9 -->
<!-- sldr:zone name=subheadline ph=body idx=3 rep=placeholder-text x=4.4 y=15.5 w=70 h=5 -->
<!-- sldr:zone name=content ph=body idx=1 rep=placeholder-text x=4.4 y=22.2 w=44 h=64 -->
<!-- sldr:zone name=image rep=picture x=52 y=22.2 w=43.6 h=64 -->
<!-- sldr:zone name=footer ph=body idx=2 rep=placeholder-text x=4.4 y=92.5 w=80 h=5 -->
<!-- Layout: framed-image — deck chrome (framed) with a content + image body
     (::content:: / ::image:: markers); image on the right. -->
<div class="sldr-framed">
  <header class="sldr-frame-head">
    {{headline}}
    {{subheadline}}
  </header>
  <div class="sldr-frame-body">
    <div class="sldr-frame-imgsplit">
      <div class="sldr-col-content">
        {{content}}
      </div>
      <div class="sldr-col-image">
        {{image}}
      </div>
    </div>
  </div>
  <footer class="sldr-frame-foot">
    {{footer}}
    {{source}}
  </footer>
</div>
