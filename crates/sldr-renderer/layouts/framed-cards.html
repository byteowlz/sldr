<!-- sldr:category framed -->
<!-- sldr:tags classic, branded -->
<!-- PPTX export zones (coordinates are percent of the slide box). -->
<!-- sldr:zone name=headline ph=title rep=placeholder-text x=4.4 y=6.3 w=70 h=9 -->
<!-- sldr:zone name=subheadline ph=body idx=3 rep=placeholder-text x=4.4 y=15.5 w=70 h=5 -->
<!-- sldr:zone name=content ph=body idx=1 rep=placeholder-text x=4.4 y=22.2 w=91.1 h=64 -->
<!-- sldr:zone name=footer ph=body idx=2 rep=placeholder-text x=4.4 y=92.5 w=80 h=5 -->
<!-- Layout: framed-cards — deck chrome (framed) with a list rendered as a row
     of cards. Each top-level list item is one card: an optional leading image
     (icon or logo), a bold lead (`**Title**`) as the card title, and the rest
     as body copy. Up to four items sit in one row; five or six wrap into a
     3×2 grid; more wrap into four columns. An intro paragraph before the list
     stays above the cards. Use for definitions, options, "N things", or
     before/after comparisons on a branded deck. -->
<style>
/* Cards are as tall as the tallest card in their row and the row sits
   vertically centred in the body — a short set of cards reads as a band,
   not as four empty columns. A dense set grows to the body and shrinks
   from there. */
.sldr-slide[data-layout="framed-cards"] .sldr-frame-body { justify-content: center; }
.sldr-slide[data-layout="framed-cards"] .sldr-frame-body > ul {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: calc(var(--sldr-u) * 1.6);
  flex: 0 1 auto;
  min-height: 0;
  align-items: stretch;
}
/* Five or six cards: 3 × 2; seven or more: 4 columns wrapping. */
.sldr-slide[data-layout="framed-cards"] .sldr-frame-body > ul:has(> :nth-child(5)) {
  grid-auto-flow: row;
  grid-template-columns: repeat(3, 1fr);
}
.sldr-slide[data-layout="framed-cards"] .sldr-frame-body > ul:has(> :nth-child(7)) {
  grid-template-columns: repeat(4, 1fr);
}
.sldr-slide[data-layout="framed-cards"] .sldr-frame-body > ul > li {
  margin: 0;
  min-width: 0;
  display: block;
  padding: calc(var(--sldr-uh) * 2.4) calc(var(--sldr-u) * 1.5);
  background: var(--sldr-surface);
  border: var(--sldr-border-width) var(--sldr-border-style) var(--sldr-border);
  border-top: 3px solid var(--sldr-accent);
  border-radius: var(--sldr-radius);
  font-size: calc(var(--sldr-u) * 1.35 * var(--sldr-type-scale));
  line-height: 1.4;
  color: var(--sldr-text);
}
/* Denser type when four or more cards share the row. */
.sldr-slide[data-layout="framed-cards"] .sldr-frame-body > ul:has(> :nth-child(4)) > li {
  font-size: calc(var(--sldr-u) * 1.2 * var(--sldr-type-scale));
  line-height: 1.3;
}
.sldr-slide[data-layout="framed-cards"] .sldr-frame-body > ul > li > p { margin: 0 0 calc(var(--sldr-uh) * 1.2); }
.sldr-slide[data-layout="framed-cards"] .sldr-frame-body > ul > li > p:last-child { margin-bottom: 0; }
/* A leading image is the card's icon/logo; several in a row (a set of vendor
   logos, say) sit side by side. Works for tight lists (images directly in the
   li) and loose ones (images in a leading paragraph). */
.sldr-slide[data-layout="framed-cards"] .sldr-frame-body > ul > li > img,
.sldr-slide[data-layout="framed-cards"] .sldr-frame-body > ul > li > p:first-child:has(> img:first-child) > img {
  display: inline-block;
  height: calc(var(--sldr-uh) * 9);
  width: auto;
  max-width: 100%;
  object-fit: contain;
  vertical-align: middle;
  margin: 0 calc(var(--sldr-u) * 1) calc(var(--sldr-uh) * 1.4) 0;
}
/* `**Title**` lead → card title. */
.sldr-slide[data-layout="framed-cards"] .sldr-frame-body > ul > li > strong:first-of-type,
.sldr-slide[data-layout="framed-cards"] .sldr-frame-body > ul > li > p > strong:first-of-type {
  display: block;
  font-family: var(--sldr-heading-font);
  font-size: calc(var(--sldr-u) * 1.75 * var(--sldr-type-scale));
  font-weight: var(--sldr-heading-weight);
  line-height: 1.2;
  color: var(--sldr-primary);
  margin-bottom: 0.4em;
}
.sldr-slide[data-layout="framed-cards"] .sldr-frame-body > ul > li blockquote {
  margin: 0;
  padding: 0;
  border: 0;
  font-style: italic;
}
/* Nested lists inside a card keep the body size. */
.sldr-slide[data-layout="framed-cards"] .sldr-frame-body > ul > li ul {
  margin: 0;
  padding-left: 1.1em;
}
</style>
<div class="sldr-framed">
  <header class="sldr-frame-head">
    {{headline}}
    {{subheadline}}
  </header>
  <div class="sldr-frame-body">
    {{content}}
  </div>
</div>
