<!-- sldr:category framed -->
<!-- sldr:tags classic, branded -->
<!-- Layout: framed — persistent deck chrome: a headline/subheadline zone on
     top, the markdown body in the middle, a footer + web-clipping source line
     at the bottom. headline/subheadline come from the slide's title/subtitle;
     footer from the slide or flavor; source from source/source_url. Logos and
     background come from the flavor; shared chrome CSS in base.css. -->
<div class="sldr-framed">
  <header class="sldr-frame-head">
    {{headline}}
    {{subheadline}}
  </header>
  <div class="sldr-frame-body">
    {{content}}
  </div>
  <footer class="sldr-frame-foot">
    {{footer}}
    {{source}}
  </footer>
</div>
