<!-- sldr:category body -->
<!-- sldr:tags classic -->
<!-- Layout: agenda — a numbered run-of-show with oversized outline numerals. -->
<style>
.sldr-slide[data-layout="agenda"] .sldr-content {
  justify-content: flex-start;
  padding-top: calc(var(--sldr-uh) * 4);
  gap: calc(var(--sldr-uh) * 3.5);
}
.sldr-slide[data-layout="agenda"] ol {
  list-style: none;
  counter-reset: agenda;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: calc(var(--sldr-uh) * 1.8);
}
.sldr-slide[data-layout="agenda"] ol li {
  counter-increment: agenda;
  display: flex;
  align-items: baseline;
  gap: calc(var(--sldr-u) * 2.4);
  padding: 0 0 calc(var(--sldr-uh) * 1.8);
  margin: 0;
  border-bottom: var(--sldr-border-width) var(--sldr-border-style) var(--sldr-border);
  font-size: calc(var(--sldr-u) * 2.4);
}
.sldr-slide[data-layout="agenda"] ol li:last-child {
  border-bottom: none;
}
.sldr-slide[data-layout="agenda"] ol li::before {
  content: counter(agenda, decimal-leading-zero);
  font-family: var(--sldr-code-font);
  font-size: calc(var(--sldr-u) * 4);
  font-weight: 700;
  line-height: 1;
  color: transparent;
  -webkit-text-stroke: 1.5px var(--sldr-accent);
  min-width: 2ch;
}
</style>
<div class="sldr-content">
  {{content}}
</div>
