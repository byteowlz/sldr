<!-- sldr:category framed -->
<!-- sldr:tags classic, branded -->
<!-- PPTX export zones (coordinates are percent of the slide box). -->
<!-- sldr:zone name=headline ph=title rep=placeholder-text x=8 y=38 w=84 h=16 -->
<!-- sldr:zone name=subheadline ph=body idx=3 rep=placeholder-text x=8 y=55 w=84 h=8 -->
<!-- Layout: framed-section — section divider on the deck background: a
     single centered headline (with optional subheadline below). Partner
     logos come from the flavor. -->
<style>
.sldr-slide[data-layout="framed-section"] { padding: 0; }
.sldr-section-frame {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  text-align: center; gap: calc(var(--sldr-uh) * 1.5);
  padding: calc(var(--sldr-uh) * 10);
}
.sldr-section-frame .sldr-headline {
  font-size: calc(var(--sldr-u) * 5);
  font-weight: var(--sldr-heading-weight);
  letter-spacing: var(--sldr-heading-tracking);
  line-height: 1.05; color: var(--sldr-text); margin: 0;
}
.sldr-section-frame .sldr-subheadline {
  font-size: calc(var(--sldr-u) * 2); color: var(--sldr-accent); margin: 0;
}
</style>
<div class="sldr-section-frame">
  {{headline}}
  {{subheadline}}
</div>
