<!-- Layout: framed-section — section divider on the deck background: a
     single centered headline (with optional subheadline below). Partner
     logos come from the flavor. -->
<style>
.sldr-slide[data-layout="framed-section"] { padding: 0; }
.sldr-section-frame {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  text-align: center; gap: clamp(8px, 1.5vh, 18px);
  padding: clamp(48px, 10vh, 120px);
}
.sldr-section-frame .sldr-headline {
  font-size: clamp(34px, 5vw, 72px);
  font-weight: var(--sldr-heading-weight);
  letter-spacing: var(--sldr-heading-tracking);
  line-height: 1.05; color: var(--sldr-text); margin: 0;
}
.sldr-section-frame .sldr-subheadline {
  font-size: clamp(16px, 2vw, 26px); color: var(--sldr-accent); margin: 0;
}
</style>
<div class="sldr-section-frame">
  {{headline}}
  {{subheadline}}
</div>
