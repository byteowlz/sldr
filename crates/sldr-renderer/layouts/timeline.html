<!-- Layout: timeline — heading plus a list rendered as horizontal milestones on a connector line. -->
<style>
.sldr-slide[data-layout="timeline"] .sldr-content {
  justify-content: flex-start;
  padding-top: calc(var(--sldr-uh) * 4);
  gap: calc(var(--sldr-uh) * 5);
}
.sldr-slide[data-layout="timeline"] :is(ul, ol) {
  display: flex;
  list-style: none;
  padding: calc(var(--sldr-uh) * 4) 0 0;
  margin: 0;
  gap: calc(var(--sldr-u) * 2.5);
  position: relative;
}
.sldr-slide[data-layout="timeline"] :is(ul, ol)::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: var(--sldr-border-width);
  background: var(--sldr-border-bright);
}
.sldr-slide[data-layout="timeline"] li {
  flex: 1 1 0;
  position: relative;
  padding: calc(var(--sldr-uh) * 1.6) 0 0;
  margin: 0;
  font-size: calc(var(--sldr-u) * 1.5);
  line-height: 1.45;
}
.sldr-slide[data-layout="timeline"] li::before {
  content: '';
  position: absolute;
  top: calc(calc(var(--sldr-uh) * 4) * -1);
  left: 0;
  width: calc(var(--sldr-u) * 1.2);
  height: calc(var(--sldr-u) * 1.2);
  transform: translateY(-40%);
  border-radius: 50%;
  background: var(--sldr-background);
  border: 2px solid var(--sldr-accent);
}
.sldr-slide[data-layout="timeline"] li > strong:first-child {
  display: block;
  color: var(--sldr-accent);
  font-family: var(--sldr-code-font);
  font-size: calc(var(--sldr-u) * 1.3);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 0.35em;
}
</style>
<div class="sldr-content">
  {{content}}
</div>
