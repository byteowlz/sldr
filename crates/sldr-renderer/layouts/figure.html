<!-- sldr:category image -->
<!-- sldr:tags classic -->
<!-- Layout: figure — classic header (title + subtitle) above a single image
     that fills the slide body, with an optional source / footer line beneath.
     The unbranded counterpart of framed-figure: a chart, diagram, or
     screenshot that *is* the slide, captioned. Use image-center for the image
     alone (no header), framed-figure for the branded (logo/background) frame. -->
<style>
.sldr-slide[data-layout="figure"] .sldr-content {
  justify-content: flex-start;
  gap: calc(var(--sldr-uh) * 1.6);
  max-width: none;
  padding-top: calc(var(--sldr-uh) * 2.5);
}
.sldr-slide[data-layout="figure"] .sldr-figure-head { flex: 0 0 auto; }
.sldr-slide[data-layout="figure"] .sldr-headline {
  font-size: calc(var(--sldr-u) * 2.29);
  font-weight: 700;
  letter-spacing: var(--sldr-heading-tracking);
  line-height: 1.12;
  color: var(--sldr-text);
  margin: 0;
}
.sldr-slide[data-layout="figure"] .sldr-subheadline {
  font-size: calc(var(--sldr-u) * 1.6);
  font-weight: 400;
  line-height: 1.2;
  color: var(--sldr-accent);
  margin: calc(var(--sldr-u) * 0.3) 0 0;
}
/* The image fills all space between header and footer, contained (never
 * cropped). min-height:0 lets it shrink within the flex column instead of
 * forcing overflow. Mirrors image-center's single-image treatment. */
.sldr-slide[data-layout="figure"] .sldr-figure-body {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.sldr-slide[data-layout="figure"] .sldr-figure-body > p {
  margin: 0;
  min-height: 0;
  max-width: 100%;
  max-height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.sldr-slide[data-layout="figure"] .sldr-figure-body img {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  display: block;
}
/* Source attribution sits above the footer (copyright); either may be absent
 * — empty slots collapse to a zero-height line. */
.sldr-slide[data-layout="figure"] .sldr-figure-foot { flex: 0 0 auto; }
.sldr-slide[data-layout="figure"] .sldr-source {
  font-family: var(--sldr-body-font);
  font-size: calc(var(--sldr-u) * 1);
  line-height: 1.3;
  color: var(--sldr-text-dim, var(--sldr-text));
  opacity: 0.65;
}
.sldr-slide[data-layout="figure"] .sldr-source-label { color: var(--sldr-accent); }
.sldr-slide[data-layout="figure"] .sldr-source a {
  color: inherit;
  text-decoration: underline;
  text-underline-offset: 2px;
}
.sldr-slide[data-layout="figure"] .sldr-footer {
  font-family: var(--sldr-body-font);
  font-size: calc(var(--sldr-u) * 1.05);
  color: var(--sldr-text-dim, var(--sldr-text));
  opacity: 0.7;
  margin-top: calc(var(--sldr-u) * 0.4);
}
</style>
<div class="sldr-content">
  <header class="sldr-figure-head">
    {{headline}}
    {{subheadline}}
  </header>
  <div class="sldr-figure-body">
    {{content}}
  </div>
  <footer class="sldr-figure-foot">
    {{source}}
    {{footer}}
  </footer>
</div>
