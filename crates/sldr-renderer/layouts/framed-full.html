<!-- sldr:category framed -->
<!-- sldr:tags classic, branded -->
<!-- PPTX export zones (coordinates are percent of the slide box). -->
<!-- sldr:zone name=content rep=picture x=0 y=0 w=100 h=100 -->
<!-- sldr:zone name=source ph=body idx=2 rep=placeholder-text x=4.4 y=92 w=86 h=5 -->
<!-- Layout: framed-full — edge-to-edge media (image or video) over the deck
     background, no chrome. For web clippings / screenshots / video stills.
     An optional source line floats bottom-left. -->
<style>
.sldr-slide[data-layout="framed-full"] { padding: 0; }
.sldr-full-frame { position: absolute; inset: 0; display: flex; }
.sldr-full-frame .sldr-frame-body {
  flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0;
}
.sldr-full-frame .sldr-frame-body :is(img, video) {
  max-width: 100%; max-height: 100%; object-fit: contain;
}
/* The source line renders in the shared `.sldr-chrome` overlay (left 4.4%),
 * styled by base.css — no layout-local foot rules needed. */
</style>
<div class="sldr-full-frame">
  <div class="sldr-frame-body">
    {{content}}
  </div>
</div>
