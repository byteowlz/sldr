<!-- sldr:category title -->
<!-- sldr:tags expressive -->
<!-- Layout: hero-stat — one enormous number with its story. First heading is the stat, following text is the caption. -->
<style>
.sldr-slide[data-layout="hero-stat"] .sldr-content {
  justify-content: center;
  align-items: flex-start;
  gap: calc(var(--sldr-uh) * 1.5);
}
.sldr-slide[data-layout="hero-stat"] h1 {
  font-size: calc(var(--sldr-u) * 22);
  line-height: 0.9;
  letter-spacing: calc(var(--sldr-heading-tracking) * 2);
  color: var(--sldr-accent);
  font-variant-numeric: tabular-nums;
  margin: 0;
}
.sldr-slide[data-layout="hero-stat"] h2 {
  font-size: calc(var(--sldr-u) * 2.6);
  color: var(--sldr-text);
  max-width: 24ch;
}
.sldr-slide[data-layout="hero-stat"] p {
  font-size: calc(var(--sldr-u) * 1.8);
  color: var(--sldr-text-dim, var(--sldr-text));
  max-width: 48ch;
}
</style>
<div class="sldr-content">
  {{content}}
</div>
