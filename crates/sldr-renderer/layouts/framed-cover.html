<!-- Layout: framed-cover — title slide on the deck background. Subheadline
     reads as an eyebrow above an oversized headline; the markdown body
     carries a date or strapline. Footer/source omitted; partner logos come
     from the flavor. -->
<style>
.sldr-slide[data-layout="framed-cover"] { padding: 0; }
.sldr-cover-frame {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: center;
  gap: clamp(10px, 1.8vh, 22px);
  padding: clamp(48px, 9vh, 110px) clamp(56px, 7vw, 120px);
}
.sldr-cover-frame .sldr-subheadline {
  order: -1;
  font-size: clamp(15px, 1.8vw, 22px);
  font-weight: 600; color: var(--sldr-text); margin: 0;
}
.sldr-cover-frame .sldr-headline {
  font-size: clamp(40px, 6vw, 88px);
  font-weight: var(--sldr-heading-weight);
  letter-spacing: var(--sldr-heading-tracking);
  line-height: 1.02; color: var(--sldr-text); margin: 0;
  max-width: 22ch;
}
.sldr-cover-frame .sldr-cover-body {
  font-size: clamp(15px, 1.8vw, 22px);
  color: var(--sldr-text-dim, var(--sldr-text)); margin-top: clamp(8px, 1.5vh, 18px);
}
</style>
<div class="sldr-cover-frame">
  {{subheadline}}
  {{headline}}
  <div class="sldr-cover-body">
    {{content}}
  </div>
</div>
