<!-- sldr:category title -->
<!-- sldr:tags classic -->
<!-- PPTX export zones (coordinates are percent of the slide box). -->
<!-- sldr:zone name=content ph=body idx=1 rep=placeholder-text x=8 y=32 w=84 h=36 -->
<!-- Layout: contact — closing slide: a big thank-you and contact lines as quiet chips. -->
<style>
.sldr-slide[data-layout="contact"] {
  justify-content: center;
  align-items: center;
  text-align: center;
}
.sldr-slide[data-layout="contact"] .sldr-content {
  justify-content: center;
  align-items: center;
  gap: calc(var(--sldr-uh) * 3);
}
.sldr-slide[data-layout="contact"] h1 {
  font-size: calc(var(--sldr-u) * 6.5);
}
.sldr-slide[data-layout="contact"] ul {
  list-style: none;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: calc(var(--sldr-u) * 1.4);
  padding: 0;
  margin: 0;
}
.sldr-slide[data-layout="contact"] ul li {
  margin: 0;
  padding: calc(var(--sldr-uh) * 1.2) calc(var(--sldr-u) * 2);
  border: var(--sldr-border-width) var(--sldr-border-style) var(--sldr-border-bright);
  border-radius: 999px;
  font-family: var(--sldr-code-font);
  font-size: calc(var(--sldr-u) * 1.4);
  letter-spacing: 0.5px;
}
.sldr-slide[data-layout="contact"] ul li a {
  text-decoration: none;
}
.sldr-slide[data-layout="contact"] p {
  color: var(--sldr-text-dim, var(--sldr-text));
  max-width: 50ch;
}
</style>
<div class="sldr-content">
  {{content}}
</div>
