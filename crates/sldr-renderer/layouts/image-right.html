<!-- sldr:category image -->
<!-- sldr:tags classic -->
<!-- PPTX export zones: content left as an editable text placeholder, image
     right as an embedded picture. Coordinates are percent of the slide box. -->
<!-- sldr:zone name=content ph=body idx=1 rep=placeholder-text x=4.4 y=8 w=43.6 h=84 -->
<!-- sldr:zone name=image rep=picture x=52 y=8 w=44 h=84 -->
<!-- Layout: image-right — content left, image column right (::content:: / ::image:: markers) -->
<div class="sldr-content">
  <div class="sldr-columns">
    <div class="sldr-col-content">
      {{content}}
    </div>
    <div class="sldr-col-image">
      {{image}}
    </div>
  </div>
</div>
