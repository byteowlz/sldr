<!-- sldr:category body -->
<!-- sldr:tags expressive -->
<!-- PPTX export zones (coordinates are percent of the slide box). -->
<!-- sldr:zone name=heading ph=title rep=placeholder-text x=6 y=6 w=88 h=11 -->
<!-- sldr:zone name=left ph=body idx=1 rep=placeholder-text x=6 y=22 w=42 h=70 -->
<!-- sldr:zone name=right ph=body idx=2 rep=placeholder-text x=52 y=22 w=42 h=70 -->
<!-- Layout: versus — two options head-to-head with a center divider badge (::left:: / ::right:: markers). -->
<style>
.sldr-slide[data-layout="versus"] .sldr-content {
  justify-content: flex-start;
  padding-top: calc(var(--sldr-uh) * 4);
  gap: calc(var(--sldr-uh) * 2.5);
}
.sldr-slide[data-layout="versus"] .sldr-columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: calc(var(--sldr-u) * 6);
  position: relative;
  width: 100%;
  align-content: start;
}
.sldr-slide[data-layout="versus"] .sldr-columns::before {
  content: '';
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  width: var(--sldr-border-width);
  background: var(--sldr-border-bright);
}
.sldr-slide[data-layout="versus"] .sldr-columns::after {
  content: 'VS';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: var(--sldr-code-font);
  font-size: calc(var(--sldr-u) * 1.4);
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--sldr-accent);
  background: var(--sldr-background);
  border: var(--sldr-border-width) var(--sldr-border-style) var(--sldr-border-bright);
  border-radius: 50%;
  width: calc(var(--sldr-u) * 5);
  height: calc(var(--sldr-u) * 5);
  display: flex;
  align-items: center;
  justify-content: center;
}
.sldr-slide[data-layout="versus"] .sldr-col {
  display: flex;
  flex-direction: column;
  gap: calc(var(--sldr-uh) * 1);
}
.sldr-slide[data-layout="versus"] .sldr-col > h2:first-child,
.sldr-slide[data-layout="versus"] .sldr-col > h3:first-child {
  color: var(--sldr-accent);
}
.sldr-slide[data-layout="versus"] .sldr-col:first-of-type {
  text-align: right;
}
</style>
<div class="sldr-content">
  {{heading}}
  <div class="sldr-columns">
    <div class="sldr-col">
      {{left}}
    </div>
    <div class="sldr-col">
      {{right}}
    </div>
  </div>
</div>
