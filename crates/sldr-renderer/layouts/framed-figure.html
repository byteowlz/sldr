<!-- sldr:category framed -->
<!-- sldr:tags classic, branded -->
<!-- Layout: framed-figure — deck chrome (headline/subheadline/footer + flavor
     logos/background) around a single image shown whole (uncropped), centered
     in the body, no text. The framed-family counterpart of image-center: a
     diagram, chart, or screenshot that is the slide, but still branded. Use
     framed-image when you need side content, framed-full for edge-to-edge media. -->
<style>
.sldr-slide[data-layout="framed-figure"] .sldr-frame-body {
  align-items: center;
  justify-content: center;
}
.sldr-slide[data-layout="framed-figure"] .sldr-frame-body > p {
  margin: 0;
  flex: 1;
  min-height: 0;
  max-width: 100%;
  max-height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.sldr-slide[data-layout="framed-figure"] .sldr-frame-body img {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
}
</style>
<div class="sldr-framed">
  <header class="sldr-frame-head">
    {{headline}}
    {{subheadline}}
  </header>
  <div class="sldr-frame-body">
    {{content}}
  </div>
  <footer class="sldr-frame-foot">
    {{footer}}
    {{source}}
  </footer>
</div>
