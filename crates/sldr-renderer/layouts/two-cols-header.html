<!-- sldr:category body -->
<!-- sldr:tags classic -->
<!-- PPTX export zones (coordinates are percent of the slide box). -->
<!-- sldr:zone name=heading ph=title rep=placeholder-text x=6 y=6 w=88 h=11 -->
<!-- sldr:zone name=left ph=body idx=1 rep=placeholder-text x=6 y=22 w=42 h=70 -->
<!-- sldr:zone name=right ph=body idx=2 rep=placeholder-text x=52 y=22 w=42 h=70 -->
<!-- Layout: two-cols-header — header band above two columns (::left:: / ::right:: markers) -->
<div class="sldr-content">
  {{heading}}
  <div class="sldr-columns">
    <div class="sldr-col">
      {{left}}
    </div>
    <div class="sldr-col">
      {{right}}
    </div>
  </div>
</div>
